# Model + feature contract.
# Everything the training run depends on lives here, not in code.

seed: 42
target: Status
data_path: data/Loan_Default.csv

# ---------------------------------------------------------------------------
# EXCLUSIONS. Each group is excluded for a different, documented reason.
# These lists are enforced by tests/model/test_no_leakage.py.
# ---------------------------------------------------------------------------
exclusions:
  # Target leakage. Measured on the full 148,670-row dataset:
  #   Interest_rate_spread.isna() == Status for 148,670/148,670 rows (100.000%)
  #   rate_of_interest.isna()     == Status for  99.865% of rows
  #   Upfront_charges.isna()      == Status for  97.774% of rows
  # These columns are only populated for originated, performing loans, so their
  # presence is an outcome of the event we are trying to predict.
  leakage:
    - rate_of_interest
    - Interest_rate_spread
    - Upfront_charges

  # Protected characteristics. Excluded as a deliberate fair-lending safeguard,
  # motivated by the principles behind ECOA / Regulation B. This is a design
  # decision, not a claim of regulatory compliance - that would require legal
  # review this project has not had. Measured cost of removal: 4.6 bp of ROC-AUC.
  protected:
    - Gender
    - age

  # Identifiers and zero-variance columns.
  #   ID   - unique row identifier (148,670 distinct values), pure noise
  #   year - constant (2019) for every row in the dataset
  identifiers:
    - ID
    - year

# ---------------------------------------------------------------------------
# Second-order leakage control.
# Missingness of these columns is itself predictive (a model using ONLY their
# missingness pattern scores ROC-AUC 0.7155). Median-imputing them leaves a
# recoverable signature at the imputed value, so we restrict to complete cases
# instead. Cost: 24,123 rows (16.2%). Benefit: no residual leakage channel.
# ---------------------------------------------------------------------------
complete_case_columns:
  - property_value
  - LTV
  - dtir1

# ---------------------------------------------------------------------------
# Features. Anything not listed here never reaches the model.
# ---------------------------------------------------------------------------
features:
  numeric:
    - loan_amount
    - term
    - property_value
    - income
    - Credit_Score
    - LTV
    - dtir1
  categorical:
    - loan_limit
    - approv_in_adv
    - loan_type
    - loan_purpose
    - Credit_Worthiness
    - open_credit
    - business_or_commercial
    - Neg_ammortization
    - interest_only
    - lump_sum_payment
    - construction_type
    - occupancy_type
    - Secured_by
    - total_units
    - credit_type
    - co-applicant_credit_type
    - submission_of_application
    - Region          # coarse geography; see MODEL_CARD.md "Fair lending"
    - Security_Type
  engineered:
    - loan_to_income
    - property_to_income
    - loan_to_value_ratio
    - payment_to_income
    - high_dti

# Parameters for engineered features.
# `income` in this dataset is MONTHLY, not annual: median income is 5,760 against
# a median loan of 296,500. Read as annual that implies a 52x loan-to-income
# ratio, which is not a real mortgage; read as monthly it gives 4.36x, which is.
# Cross-check: implied principal-only payment burden is 15.9% of monthly income
# against a reported median dtir1 of 39%, consistent once interest, taxes,
# insurance and other debt service are included.
feature_params:
  income_periods_per_year: 12
  # 43% is the Ability-to-Repay / Qualified Mortgage threshold under
  # 12 CFR 1026.43(e). The original code used an unexplained 50%.
  high_dti_threshold: 43.0

validation:
  test_size: 0.2
  calibration_size: 0.2   # carved out of train, used only to fit the calibrator
  cv_folds: 5
  bootstrap_iterations: 200

# ---------------------------------------------------------------------------
# Candidate models. The winner is selected on cross-validated PR-AUC
# (the appropriate primary metric at a ~16% base rate), then calibrated.
# ---------------------------------------------------------------------------
candidates:
  logistic_regression:
    C: 1.0
    max_iter: 2000
    solver: lbfgs
  random_forest:
    n_estimators: 300
    max_depth: 12
    min_samples_leaf: 20
    n_jobs: -1
  xgboost:
    n_estimators: 400
    learning_rate: 0.05
    max_depth: 5
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 10
    reg_lambda: 2.0
    eval_metric: logloss
    n_jobs: -1
    # NOTE: scale_pos_weight is deliberately NOT set. It distorts the predicted
    # probability distribution, which is incoherent with serving the output as a
    # probability of default. Imbalance is handled by metric choice (PR-AUC) and
    # by post-hoc calibration instead.

calibration:
  method: isotonic   # isotonic | sigmoid

# Guardrail. A leakage-free model on this data scores ~0.83. Anything above this
# means a leaking feature has been reintroduced; training fails loudly.
max_plausible_auc: 0.95
