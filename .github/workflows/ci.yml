name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  encoding:
    name: Encoding gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Runs before any install. A byte order mark on README.md breaks
      # `pip install -e .` itself, because pyproject reads it as long_description,
      # so every other job would fail with an opaque setuptools traceback instead
      # of naming the real problem. No dependencies needed to catch it.
      - name: Reject byte order marks and non-UTF-8 text
        run: |
          python - <<'EOF'
          import pathlib, sys
          BOMS = {b"ÿþ": "UTF-16 LE", b"þÿ": "UTF-16 BE", b"ï»¿": "UTF-8 BOM"}
          SUFFIXES = {".md",".py",".yaml",".yml",".toml",".txt",".json",".cfg",".ini",".example"}
          SKIP = {".git","venv",".venv","__pycache__","node_modules","data"}
          bad = []
          for path in pathlib.Path(".").rglob("*"):
              if not path.is_file() or any(s in path.parts for s in SKIP):
                  continue
              if path.suffix not in SUFFIXES and path.name not in {"Makefile","Procfile"}:
                  continue
              raw = path.read_bytes()
              for bom, name in BOMS.items():
                  if raw.startswith(bom):
                      bad.append(f"{path}: starts with a {name} byte order mark")
                      break
              else:
                  try:
                      raw.decode("utf-8")
                  except UnicodeDecodeError as exc:
                      bad.append(f"{path}: not valid UTF-8 ({exc})")
          if bad:
              print("Encoding problems found:")
              for line in bad:
                  print("  " + line)
              sys.exit(1)
          print("All text files are clean UTF-8 with no BOM.")
          EOF

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff==0.16.0
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts

  types:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: mypy

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run test suite
        # Tests needing the full 28MB dataset skip automatically when it is
        # absent. Model tests run against the committed artifact, and portfolio
        # tests use the committed 5,000-row sample.
        run: pytest tests/ -v --cov=loan_default --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  deploy-smoke:
    name: Railway deploy smoke test
    runs-on: ubuntu-latest
    needs: [lint, types, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install exactly what Railway installs
        # Mirrors the nixpacks.toml install phase: pinned runtime deps from
        # requirements.txt, then the package itself with --no-deps. If this
        # fails, the Railway build fails.
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install --no-deps -e .

      - name: Assert the model artifact is committed
        # The deploy builds straight from the repository, so the artifact must
        # be in version control or the service starts with no model.
        run: |
          python -c "
          import pathlib, sys
          found = list(pathlib.Path('artifacts').rglob('model.joblib'))
          print('artifacts found:', found)
          sys.exit(0 if found else 1)
          "

      - name: Boot the app with the Railway start command
        env:
          PORT: 8000
        run: |
          uvicorn loan_default.api.main:app --host 0.0.0.0 --port $PORT &
          echo $! > /tmp/api.pid
          for i in $(seq 1 45); do
            if curl -fsS "http://localhost:$PORT/health/ready" > /dev/null 2>&1; then
              echo "ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "app did not become ready"; exit 1

      - name: Smoke test the scoring endpoint
        run: |
          set -e
          curl -fsS http://localhost:8000/health/live
          curl -fsS http://localhost:8000/v1/model/metadata | head -c 300; echo
          curl -fsS -X POST http://localhost:8000/v1/risk/assess \
            -H 'Content-Type: application/json' \
            -d @tests/fixtures/example_application.json \
          | python -c "
          import json, sys
          d = json.load(sys.stdin)
          assert 0 <= d['probability_of_default'] <= 1, d
          assert d['risk_grade'] in list('ABCDEFG'), d
          assert d['decision']['decision'] in {'APPROVE', 'REFER', 'DECLINE'}, d
          print('smoke OK: PD=%.4f grade=%s decision=%s' % (
              d['probability_of_default'], d['risk_grade'], d['decision']['decision']))
          "

      - name: Smoke test the portfolio endpoint
        # Uses the committed sample, proving the fallback works on a fresh clone.
        run: |
          curl -fsS "http://localhost:8000/v1/portfolio/summary?sample_size=500" \
          | python -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d['n_exposures'] > 0, d
          print('portfolio OK: %d exposures, EL rate %.4f' % (
              d['n_exposures'], d['expected_loss_rate']))
          "

      - name: Stop app
        if: always()
        run: kill "$(cat /tmp/api.pid)" 2>/dev/null || true
